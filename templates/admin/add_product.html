{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card border-0 shadow-sm rounded-4 p-4 mx-auto" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark mb-1"><i class="fa-solid fa-plus me-2 text-primary"></i>Thêm Sản Phẩm Mới</h2>
        <p class="text-muted mb-0">Nhập thông tin sản phẩm theo danh mục phù hợp</p>
      </div>
      <a href="/admin/products" class="btn btn-outline-secondary rounded-pill">Quay lại</a>
    </div>

    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Tên sản phẩm</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Danh mục</label>
          <select name="category" class="form-select" required>
            <option value="Điện tử">Điện tử</option>
            <option value="Thời trang">Thời trang</option>
            <option value="Gia dụng">Gia dụng</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Giá (VNĐ)</label>
          <input type="number" min="0" step="1000" name="price" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Tồn kho</label>
          <input type="number" min="0" name="stock" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Ảnh</label>
          <input type="text" name="image" class="form-control" placeholder="product_001.jpg">
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Mô tả</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">CPU</label>
          <input type="text" name="cpu" class="form-control" placeholder="Intel Core i5">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">RAM</label>
          <input type="text" name="ram" class="form-control" placeholder="16GB">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Kích thước / Size</label>
          <input type="text" name="size" class="form-control" placeholder="S, M, L">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Chất liệu</label>
          <input type="text" name="material" class="form-control" placeholder="Cotton 100%">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Công suất</label>
          <input type="text" name="power" class="form-control" placeholder="1200W">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Xuất xứ</label>
          <input type="text" name="origin" class="form-control" placeholder="Việt Nam">
        </div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
          <i class="fa-solid fa-floppy-disk me-2"></i> Lưu sản phẩm
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
