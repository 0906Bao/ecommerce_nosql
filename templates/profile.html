{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card p-4 mx-auto" style="max-width: 640px;">
    <h1 class="h3 mb-4">Thông tin cá nhân</h1>
    {% for message in get_flashed_messages() %}
    <p class="alert alert-success" role="status">{{ message }}</p>
    {% endfor %}
    {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="name">Họ và tên</label>
        <input class="form-control" id="name" name="name" autocomplete="name" value="{{ customer.get('name') or '' }}" maxlength="120" required>
      </div>
      {% if customer.get('email') %}
      <div class="mb-3">
        <label class="form-label" for="email">Email đăng nhập</label>
        <input class="form-control" id="email" type="email" value="{{ customer.email }}" readonly>
      </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="phone">Số điện thoại</label>
        <input class="form-control" id="phone" type="tel" name="phone" autocomplete="tel" value="{{ customer.get('phone') or '' }}" maxlength="32" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="address">Địa chỉ giao hàng</label>
        <textarea class="form-control" id="address" name="address" autocomplete="street-address" rows="3" maxlength="500">{{ customer.get('address', customer.get('shipping_address')) or '' }}</textarea>
      </div>
      <button class="btn btn-primary" type="submit">Lưu thông tin</button>
    </form>
  </div>
</div>
{% endblock %}
